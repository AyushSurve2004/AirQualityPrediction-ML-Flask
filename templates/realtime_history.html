<!DOCTYPE html>
<html>
<head>
    <title>Real-Time AQI History</title>
</head>
<body>

<h1>Real-Time AQI History</h1>

<table border="1">
    <tr>
        <th>City</th>
        <th>Date</th>
        <th>AQI</th>
        <th>Category</th>
    </tr>

    {% for row in history %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
