<!DOCTYPE html>
<html>
<head>
    <title>My AQI Predictions</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f7fb;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#2563eb;
        }

        table{
            width:90%;
            margin:auto;
            border-collapse:collapse;
            background:white;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        th{
            background:#2563eb;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            border:1px solid #ddd;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f8f8f8;
        }
    </style>
</head>

<body>

<h1>📊 My AQI Prediction History</h1>

<table>

<tr>
    <th>Date</th>
    <th>PM2.5</th>
    <th>PM10</th>
    <th>NO2</th>
    <th>CO</th>
    <th>SO2</th>
    <th>AQI</th>
    <th>Status</th>
</tr>

{% for row in predictions %}

<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
    <td>{{ row[5] }}</td>
    <td>{{ row[6] }}</td>
    <td>{{ row[7] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
