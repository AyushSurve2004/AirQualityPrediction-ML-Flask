<!DOCTYPE html>
<html>

<head>

<title>Login - AQI Predictor</title>

<style>

body{
    font-family:Arial;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    text-align:center;
}


.box{

    width:350px;
    margin:100px auto;
    background:white;
    color:black;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);

}


input{

    width:90%;
    padding:12px;
    margin:10px;
    border-radius:8px;
    border:1px solid gray;

}


button{

    background:#2563eb;
    color:white;
    padding:12px 30px;
    border:none;
    border-radius:20px;
    cursor:pointer;

}


button:hover{

    transform:scale(1.05);

}

a{

    color:#2563eb;

}

</style>

</head>


<body>


<div class="box">

<h1>🔐 Login</h1>


<form method="POST">


<input 
name="username"
placeholder="Username"
required>


<input 
type="password"
name="password"
placeholder="Password"
required>


<button type="submit">
Login
</button>


</form>


<p>
New user?
<a href="/register">
Register
</a>
</p>


</div>


</body>

</html>
